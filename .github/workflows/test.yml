name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The development toolchain and the SDK versions this repository develops
    # against need Node 22 or later.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Vendored contract + pricing must match the pinned Python tag, untouched.
      - run: npm run sync:check
      - run: npm run typecheck
      - run: npm run lint
      # Unit, contract, instrumentor and local end-to-end tests, with the coverage floors enforced.
      - run: npm test
      - run: npm run build
      # The browser and React Native bundles reach no Node built-in, no `process`, no DOM (RN).
      - run: npm run check:bundles

  runtime:
    # The BUILT package on every supported runtime, the minimum included: it
    # loads in both module formats, and an application that never mentions it is
    # traced through the zero-code hooks, against each supported major of the
    # client libraries. An SDK version that does not support the running Node is
    # reported as skipped.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/dist-smoke.cjs
      - run: node scripts/sdk-compat.cjs
