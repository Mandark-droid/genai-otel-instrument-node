name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Vendored contract + pricing must match the pinned Python tag, untouched.
      - run: npm run sync:check
      - run: npm run typecheck
      - run: npm run lint
      # Unit, contract and instrumentor tests, with the coverage floors enforced.
      - run: npm test
      - run: npm run build

  node18:
    # The minimum supported runtime. The test toolchain needs Node 20, so here
    # the built package is loaded and exercised on Node 18 instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/dist-smoke.cjs
